name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Put the web app and face model into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          curl -sSL -o android/app/src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "LagodnaZamiec-0.1.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Łagodna Zamieć 0.1.${{ github.run_number }}
          body: |
            Plik do zainstalowania na Androidzie: pobierz LagodnaZamiec-0.1.${{ github.run_number }}.apk na telefonie i otwórz go.
            Commit: ${{ github.sha }}
          files: LagodnaZamiec-0.1.${{ github.run_number }}.apk
          make_latest: true
