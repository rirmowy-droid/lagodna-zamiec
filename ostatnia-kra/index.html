<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f6f8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ostatnia Kra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed pencil-and-shadow snowfield; a hardware-style synth front panel docks at the bottom, one tab per section */
:root{
  --paper:#ffffff;
  --paper-2:#ffffff;
  --ink:#000000;
  --graphite:#262626;
  --faint:#cfcfcf;
  --slate:#000000;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

.top{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand{display:grid;gap:4px;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,3rem);line-height:.9;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.brand p{margin:0;font-size:.72rem;color:var(--graphite);letter-spacing:.08em;text-transform:uppercase}
.brand p b{color:var(--ink);font-weight:500}
.status{display:flex;align-items:center;gap:8px}
.meter{width:54px;height:6px;border:1px solid var(--ink);display:inline-block;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--slate)}
.diag{margin:0;font-size:.64rem;color:var(--graphite);line-height:1.5}
.diagbox{display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--faint)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.btn{appearance:none;background:var(--paper-2);border:1.5px solid var(--ink);border-radius:2px;padding:7px 12px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.btn:hover{background:var(--paper)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.tab:focus-visible,.knob:focus-visible,.cell:focus-visible,select:focus-visible,.seg button:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper-2)}
.btn.rec{background:var(--ink);color:var(--paper-2)}
.btn.rec::first-letter{color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper-2);padding:9px 14px;font-size:.72rem;letter-spacing:.06em;border-radius:2px;max-width:calc(100% - 32px)}
.btn.small{padding:4px 8px;font-size:.64rem;box-shadow:1.5px 1.5px 0 var(--ink)}

.start{position:fixed;inset:0;z-index:20;display:grid;place-items:start center;padding-top:calc(17vh + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.6)}
.card{max-width:440px;width:100%;background:var(--paper-2);border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:22px 22px 20px;display:grid;gap:12px}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:.9;text-transform:uppercase}
.card p{margin:0;font-size:.82rem;line-height:1.6;color:var(--graphite)}
.card .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card small{font-size:.68rem;color:var(--graphite);letter-spacing:.06em}

.panel{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper-2);border-top:1.5px solid var(--ink);box-shadow:0 -3px 0 var(--faint);display:flex;flex-direction:column;max-height:min(58vh,560px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding-block:8px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px dashed var(--faint)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:6px 9px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools label,.field label{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite)}
#presetName{font:inherit;font-size:.72rem;border:1.5px solid var(--ink);border-radius:2px;padding:5px 8px;width:150px;background:var(--paper-2)}
select{background:var(--paper-2);border:1.5px solid var(--ink);border-radius:2px;padding:5px 8px;font-size:.72rem}
.panel-body{overflow-y:auto;padding-block:12px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel.collapsed .panel-body{display:none}
.tabsec{display:grid;gap:18px}
.module{display:grid;gap:12px}
.module + .module{padding-top:14px;border-top:1px dashed var(--faint)}
.mod-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.mod-head h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.mod-head span{font-size:.68rem;color:var(--graphite);letter-spacing:.06em}
.module.off .knobs,.module.off .wave-wrap{opacity:.38}
.mod-head .tgl{margin-left:auto}
.tgl[aria-pressed="false"]{background:var(--paper-2);color:var(--ink);border-style:dashed}
.knobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:14px 8px}
.knob{display:grid;justify-items:center;gap:3px;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:4px;padding:2px 0}
.knob svg{width:58px;height:58px;overflow:visible}
.knob .k-ring{fill:none;stroke:var(--ink);stroke-width:1.3}
.knob .k-ring2{fill:none;stroke:var(--ink);stroke-width:.6;opacity:.5}
.knob .k-track{fill:none;stroke:var(--faint);stroke-width:3}
.knob .k-arc{fill:none;stroke:var(--slate);stroke-width:3;stroke-linecap:round}
.knob .k-tick{stroke:var(--graphite);stroke-width:1}
.knob .k-ind{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.knob .k-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.2}
.knob .k-val{font-size:.68rem;color:var(--graphite);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.field{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--paper-2);padding:6px 11px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper-2)}
.wave-wrap{display:grid;gap:4px}
.wave-wrap canvas{width:100%;height:56px;display:block;border:1px solid var(--faint);background:var(--paper)}
.wave-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.64rem;color:var(--graphite);letter-spacing:.06em}
.prog{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.slot{display:grid;gap:4px;padding:6px;border:1.3px solid var(--ink);border-radius:2px;background:var(--paper);min-width:92px}
.slot.now{box-shadow:0 0 0 2px var(--slate)}
.slot-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.6rem;letter-spacing:.12em;color:var(--graphite);text-transform:uppercase}
.slot-x{appearance:none;border:0;background:none;cursor:pointer;font-size:.9rem;line-height:1;padding:0 2px;color:var(--graphite)}
.slot select{width:100%}
.add{appearance:none;border:1.3px dashed var(--graphite);background:none;border-radius:2px;min-width:70px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);cursor:pointer}
.seq{display:grid;grid-template-columns:repeat(var(--cols,16),minmax(0,1fr));gap:4px}
.cell{appearance:none;position:relative;height:64px;border:1.3px solid var(--graphite);background:var(--paper-2);border-radius:2px;cursor:pointer;padding:0;overflow:hidden}
.cell.beat{border-color:var(--ink);border-width:2px}
.cell .bar{position:absolute;left:3px;right:3px;bottom:3px;background:var(--faint)}
.cell.on .bar{background:var(--ink)}
.cell.now{box-shadow:0 0 0 2px var(--slate)}
.cell.now.on .bar{background:var(--slate)}
.hint{font-size:.66rem;color:var(--graphite);letter-spacing:.06em;margin:0}
.tabsec.drone .seq-only{display:none}
.tabsec:not(.drone) .drone-only{display:none}
@media (max-width:620px){
  .seq{grid-template-columns:repeat(var(--cols-narrow,8),minmax(0,1fr))}
  .cell{height:46px}
  .panel{max-height:50vh}
  .knobs{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<canvas id="scene" aria-hidden="true"></canvas>

<header class="top">
  <div class="brand">
    <h1>Ostatnia Kra</h1>
    <p><b id="chordName">Am</b> · <span id="keyLabel">A eolska</span> · <span id="bpmLabel">66</span> BPM · <span id="meterLabel">4/4</span> · <span id="modeLabel">sekwencer</span></p>
    <p class="status"><span class="meter"><i id="meterFill"></i></span><span id="audioState">dźwięk: wyłączony</span><span id="sleepState"></span><span id="handState"></span></p>
  </div>
  <div class="actions">
    <button class="btn primary" id="playBtn" type="button">Graj</button>
    <button class="btn" id="recBtn" type="button" aria-pressed="false">● Nagraj</button>
    <button class="btn" id="panelBtn" type="button" aria-expanded="true">Ukryj panel</button>
  </div>
</header>

<div class="start" id="start">
  <div class="card">
    <h2>Ostatnia Kra</h2>
    <p>Lead z nagrania pękającego lodu, dwa basy, chór z czterech sekcji i surowe synty. Własna progresja, metrum, tryb drone, własne presety i nagrywanie.</p>
    <div class="row">
      <button class="btn primary" id="startBtn" type="button">Rozpocznij</button>
      <small>Najlepiej na słuchawkach albo z subwooferem.</small>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<section class="panel" id="panel" aria-label="Panel syntezatora">
  <div class="panel-head">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tools">
      <label for="preset">Preset</label>
      <select id="preset"></select>
      <button class="btn" id="savePresetBtn" type="button">Zapisz preset</button>
      <button class="btn" id="delPresetBtn" type="button" hidden>Usuń</button>
      <form id="presetForm" class="tools" hidden><input id="presetName" maxlength="32" placeholder="Nazwa presetu" aria-label="Nazwa presetu"><button class="btn primary" type="submit">OK</button><button class="btn" type="button" id="presetCancel">Anuluj</button></form>
      <button class="btn" id="uploadBtn" type="button">Wgraj sampel</button>
      <input type="file" id="file" accept="audio/*" hidden>
    </div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</section>

  const sr=buf.sampleRate,n=buf.length,h=256,ch=buf.numberOfChannels;
  const a=buf.getChannelData(0),b=ch>1?buf.getChannelData(1):a;
  const frames=Math.floor(n/h),e=new Float32Array(frames);
  for(let f=0;f<frames;f++){let s=0;for(let i=f*h;i<(f+1)*h;i++){const x=(a[i]+b[i])*.5;s+=x*x;}e[f]=Math.log(Math.sqrt(s/h)+1e-4);}
  const d=new Float32Array(frames);let mean=0;
  for(let f=1;f<frames;f++){d[f]=Math.max(0,e[f]-e[f-1]);mean+=d[f];}
  mean/=frames;let sd=0;for(let f=1;f<frames;f++)sd+=(d[f]-mean)**2;sd=Math.sqrt(sd/frames);
  const thr=mean+2*sd,out=[],pk=[];let last=-1;
  for(let f=1;f<frames-1;f++){
    if(d[f]>thr&&d[f]>=d[f-1]&&d[f]>=d[f+1]){
      const t=f*h/sr;if(t-last<.03)continue;last=t;
      let m=0;const s0=f*h,s1=Math.min(n,s0+Math.floor(sr*.05));for(let i=s0;i<s1;i++)m=Math.max(m,Math.abs(a[i]));

    }

/* choir: four sections, each with its own source timbre, through three vowel formants */
const VOWELS=[[325,700,2530],[450,800,2830],[800,1150,2900],[400,1600,2700],[300,2300,3000]];
const FAMP=[1,.55,.28],FBW=[80,90,120];
const SECTIONS=[
  {id:'basses',fem:false,make:'saw',  notes:c=>[c.root+12,c.pad[0]-12],gain:1.1},
  {id:'tenors',fem:false,make:'pulse',notes:c=>[c.pad[0],c.pad[1]],gain:1.0},
  {id:'altos', fem:true, make:'soft', notes:c=>[c.pad[1],c.pad[2]],gain:1.25},
  {id:'sopranos',fem:true,make:'air', notes:c=>[c.pad[2],c.pad[3]],gain:1.5}

function vowelF(v){const x=clamp(v,0,1)*4,i=Math.min(3,Math.floor(x)),f=x-i;return[0,1,2].map(k=>lerp(VOWELS[i][k],VOWELS[i+1][k],f));}
function buildChoir(){
  const waves={
    saw:wave(h=>[0,1/Math.pow(h,1.15)],48),
    pulse:wave(h=>[0,(h%2?1:.55)/Math.pow(h,1.35)],40),
    soft:wave(h=>[0,1/Math.pow(h,1.6)],40),
    air:wave(h=>[0,(h%2?1:.4)/Math.pow(h,2.1)],24)
  };
  N.choirAmp=G();N.choirAmp.gain.value=0;N.choirGain=G();N.choirFX=makeFX(false,N.padsBus);
  N.gateChoir=G();N.cenvG=G();N.choirHP=BQ('highpass',90,.6);N.choirLP=BQ('lowpass',6500,.5);N.choirAmp.connect(N.choirHP);N.choirHP.connect(N.choirLP);N.choirLP.connect(N.cenvG);N.cenvG.connect(N.choirGain);N.choirGain.connect(N.gateChoir);N.gateChoir.connect(N.choirFX.inp);
  N.choirNoise=ctx.createBufferSource();N.choirNoise.buffer=N.noise;N.choirNoise.loop=true;N.choirNoise.start();
  N.breathLP=BQ('lowpass',4200,.5);N.breathHP=BQ('highpass',600,.5);N.choirNoise.connect(N.breathLP);N.breathLP.connect(N.breathHP);
  const per=LITE?2:4;
  N.sections=SECTIONS.map((S,si)=>{
    const sum=G(),out=G(),amp=G();amp.gain.value=1;
    const forms=[0,1,2].map(k=>{const bp=BQ('bandpass',VOWELS[1][k],10),gg=G();gg.gain.value=FAMP[k]*S.gain*4.2;sum.connect(bp);bp.connect(gg);gg.connect(out);return bp;});
    out.connect(amp);amp.connect(N.choirAmp);
    const br=G();br.gain.value=0;N.breathHP.connect(br);br.connect(sum);
    const notes=S.notes(curChord);
    const voices=[];
    for(let v=0;v<per;v++){
      const o=OSC(waves[S.make],mtof(notes[v%2]));
      const r=Math.random()*2-1;o.detune.value=r*.6*18;

      const vg=G();vg.gain.value=1/per;
      const vib=OSC('sine',4.4+Math.random()*1.8),vibG=G();vib.connect(vibG);vibG.connect(o.detune);vib.start(ctx.currentTime+Math.random()*.3);
      let drift=null,driftG=null;
      if(!LITE){drift=OSC('sine',.08+Math.random()*.22);driftG=G();drift.connect(driftG);driftG.connect(o.detune);drift.start();}
      o.connect(vg);vg.connect(pan);pan.connect(sum);o.start();

let frzT=0;
function frzGrain(t){
  if(!iceBuf||!onsets.length)return;const F=P.frz;
  const idx=Math.round(F.pos*(onsets.length-1)),dur=F.win/1000;
  let off=onsets[idx]+.012+F.spray*Math.random()*.35;off=Math.min(off,iceBuf.duration-dur-.02);
  const note=curChord.pad[(Math.random()*4)|0],nat=Math.pow(2,F.oct),tuned=mtof(note)/220*Math.pow(2,F.oct);
  const s=ctx.createBufferSource();s.buffer=iceBuf;s.playbackRate.value=lerp(nat,tuned,F.pitch)*(1+(Math.random()-.5)*.004);
  const g=G(),rate=frzRate(),amp=.9/Math.sqrt(Math.max(1,rate*dur))*frzNorm(idx,dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+dur*.5);g.gain.linearRampToValueAtTime(0,t+dur);
  const pan=ctx.createStereoPanner();pan.pan.value=(Math.random()-.5)*1.2*P.master.width;
  s.connect(g);g.connect(pan);pan.connect(N.freezeIn);s.start(t,Math.max(0,off),dur+.01);
}
function frzNorm(idx,dur){const key=idx+':'+dur.toFixed(3);if(frzNorm.k===key)return frzNorm.v;
  const d=iceBuf.getChannelData(0),sr=iceBuf.sampleRate,a=Math.floor((onsets[idx]+.012)*sr),n=Math.max(64,Math.floor((dur+.35*P.frz.spray)*sr));let ss=0,c=0;
  for(let i=a;i<Math.min(d.length,a+n);i++){ss+=d[i]*d[i];c++;}const rms=Math.sqrt(ss/Math.max(1,c));frzNorm.k=key;frzNorm.v=clamp(.12/(rms+1e-4),1,30);return frzNorm.v;}
function frzRate(){return(6+P.frz.dens*34)*(LITE?.6:1);}

function setP(param,v,t=.05){if(!ctx||!param)return;param.setTargetAtTime(v,ctx.currentTime,t);}
function applyParam(mod,key){
  if(!ctx||!N.mix)return;const v=P[mod][key];
  try{switch(mod+'.'+key){
    case 'lead.tone':setP(N.leadLP.frequency,v);break;
    case 'lead.level':setP(N.leadGain.gain,v*1.1);break;
    case 'lead.space':setP(N.leadRev.gain,v*.9);setP(N.leadDly.gain,.15+v*.35);break;
    case 'lead.struct':setP(N.structOut.gain,v*2.2);break;
    case 'bass.level':setP(N.bassGain.gain,v*1.15);break;
    case 'bass.sub':setP(N.subG.gain,v*.62);break;
    case 'bass.drive':N.bassSh.curve=shaperCurve(1+v*14);setP(N.sawG.gain,.32*(1-v*.35));break;
    case 'bass.cutoff':setP(N.bassF.frequency,v,.1);break;
    case 'bass.reso':setP(N.bassF.Q,.7+v*13);break;
    case 'bass.harm':setP(N.harmG.gain,v*.5);break;
    case 'bass.oct':case 'bass.glide':case 'deep.oct':glideBass(ctx.currentTime);break;
    case 'deep.level':setP(N.deepOut.gain,v*.8);break;
    case 'deep.sub':setP(N.dSubG.gain,v*.95);break;
    case 'deep.grit':setP(N.dGritG.gain,v*.5);setP(N.dNoiseG.gain,v*1.4);break;
    case 'deep.tone':setP(N.dHP1.frequency,v);setP(N.dHP2.frequency,v);setP(N.dNoiseHP.frequency,v*1.1);break;
    case 'deep.rough':N.dSh.curve=shaperCurve(1+v*22);break;
    case 'deep.flutter':setP(N.dFlG.gain,v*9);break;
    case 'deep.width':setP(N.dPan1.pan,-v);setP(N.dPan2.pan,v);break;
    case 'deep.space':setP(N.deepRev.gain,v*.9);break;
    case 'choir.level':setP(N.choirGain.gain,v);break;
    case 'choir.basses':case 'choir.tenors':case 'choir.altos':case 'choir.sopranos':{const s=N.sections.find(x=>x.S.id===key);setP(s.out.gain,v);applyParam('choir','breath');break;}
    case 'choir.vowel':N.sections.forEach(s=>{const f=vowelF(v),sc=s.S.fem?1.17:1;s.forms.forEach((bp,k)=>{setP(bp.frequency,f[k]*sc,.45);setP(bp.Q,f[k]*sc/(FBW[k]*(s.S.fem?1.1:1)),.45);});});break;
    case 'choir.size':N.sections.forEach(s=>s.voices.forEach(x=>{x.o.detune.setTargetAtTime(x.r*v*20,ctx.currentTime,.6);if(x.driftG)setP(x.driftG.gain,v*14);}));break;
    case 'choir.vib':N.sections.forEach(s=>s.voices.forEach(x=>setP(x.vibG.gain,v*28)));break;
    case 'choir.breath':N.sections.forEach((s,i)=>setP(s.br.gain,v*[.02,.03,.045,.06][i]*(P.choir[s.S.id]>0?1:0),.3));break;
    case 'pad.level':setP(N.padGain.gain,v);break;
    case 'pad.raw':{const r=v;if(Math.abs(r-(N.padSh._r??-1))>.06){N.padSh._r=r;N.padSh.curve=shaperCurve(1+r*r*10);}setP(N.padF.frequency,260+r*r*5200,.2);applyParam('pad','lfo');break;}

    case 'osc1.wave':case 'osc2.wave':case 'osc3.wave':{const k=OSCK[+mod[3]-1];N.voices.forEach(x=>{if(v===4)x[k].setPeriodicWave(N.pulse);else x[k].type=['sine','triangle','sawtooth','square'][v];});padLevels();break;}
    case 'osc1.oct':case 'osc2.oct':case 'osc3.oct':case 'osc1.semi':case 'osc2.semi':case 'osc3.semi':padPitch(ctx.currentTime,.05);break;
    case 'osc1.level':case 'osc2.level':case 'osc3.level':padLevels();break;

    case 'bassfx.drive':N.bassFX.drive(v);break;

    case 'bassfx.rate':N.bassFX.rate(v);break;
    case 'choirfx.drive':N.choirFX.drive(v);break;
    case 'choirfx.chorus':N.choirFX.chorus(v);break;
    case 'choirfx.rate':N.choirFX.rate(v);break;
    case 'choirfx.reverb':setP(N.choirFX.rev.gain,v*1.1);break;

    case 'padfx.drive':N.padFX.drive(v);break;
    case 'padfx.chorus':N.padFX.chorus(v);break;

function drawWave(){
  waveCv=waveCv||document.getElementById('wave');
  if(!waveCv||!iceBuf)return;const dpr=Math.min(2,window.devicePixelRatio||1),w=waveCv.clientWidth,h=waveCv.clientHeight;if(!w)return;
  waveCv.width=w*dpr;waveCv.height=h*dpr;const g=waveCv.getContext('2d');g.scale(dpr,dpr);
  const d=iceBuf.getChannelData(0),per=Math.max(1,Math.floor(d.length/w));let mx=0;for(let i=0;i<d.length;i+=7)mx=Math.max(mx,Math.abs(d[i]));
  g.strokeStyle='#000';g.lineWidth=1;g.beginPath();
  for(let x=0;x<w;x++){let lo=0,hi=0;for(let i=x*per;i<(x+1)*per&&i<d.length;i++){const v=d[i];if(v<lo)lo=v;if(v>hi)hi=v;}g.moveTo(x+.5,h/2-hi/mx*h*.45);g.lineTo(x+.5,h/2-lo/mx*h*.45);}
  g.stroke();
  const dur=iceBuf.duration;
  if(ON.frz&&onsets.length){const fi=Math.round(P.frz.pos*(onsets.length-1)),fx=onsets[fi]/dur*w;g.fillStyle='rgba(0,0,0,.14)';g.fillRect(fx,0,Math.max(4,P.frz.win/1000/dur*w),h);g.fillStyle='#000';g.fillRect(fx,0,2,h);}
  onsets.forEach((o,i)=>{const x=o/dur*w,hot=i===lastGrainIdx&&grainFlash>.05;g.fillStyle=hot?'rgba(0,0,0,'+(.4+grainFlash*.6)+')':'rgba(0,0,0,.35)';g.fillRect(x,0,hot?3:1.3,h);});
  document.getElementById('waveName').textContent=`Sampel: ${sampleName} · ${dur.toFixed(1).replace('.',',')} s · ${onsets.length} pęknięć`;
}

  if(ctx){const ct=ctx.currentTime;for(let i=visQ.length-1;i>=0;i--){if(visQ[i].t<=ct){visQ[i].fn();visQ.splice(i,1);}}}
  cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#ffffff';cx.fillRect(0,0,W,H);
  if(!reduce&&shake>.05){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake*.6);shake*=.9;}
  cx.drawImage(layers[reduce?0:Math.floor(now/140)%3],0,0,W,H);
  cx.lineCap='round';cx.lineJoin='round';
  cracks=cracks.filter(c=>{const age=now-c.born;if(age>c.grow+c.life)return false;
    const p=clamp(age/c.grow,0,1),fade=age<c.grow?1:1-(age-c.grow)/c.life,fresh=clamp(1-(age-c.grow)/1400,0,1);
    // a soft shadow under each crack, then the pencil line
        cx.strokeStyle=`rgba(${INK},${fade})`;cx.lineWidth=c.w*(1+fresh*.4);strokePart(c.pts,p);
    cx.lineWidth=c.w*.6;c.branches.forEach(b=>{if(p>b.at)strokePart(b.pts,clamp((p-b.at)/(1-b.at+.001),0,1));});return true;});
  gust*=Math.pow(.35,dt);lvlS+=(clamp(meterLv/.6,0,1)-lvlS)*Math.min(1,dt*.8);
  drawTrees(now/1000);
  const wind=.4+P.tex.wind*2.6+gust*2,amt=Math.min(1,P.tex.snow*(.55+lvlS*.9));
  cx.strokeStyle=`rgba(${SHADE},.45)`;cx.lineWidth=.8;cx.beginPath();
  const nd=Math.round(drift.length*Math.min(1,P.tex.wind*1.4));
  for(let i=0;i<nd;i++){const d=drift[i];if(!reduce){d.x+=d.v*wind*120*dt;d.life+=dt;}
    if(d.x>W+40||d.life>d.max){Object.assign(d,newDrift(false));d.x=Math.random()*W*.8-40;}
    const f=Math.sin(Math.PI*clamp(d.life/d.max,0,1));if(f<.05)continue;cx.moveTo(d.x,d.y);cx.lineTo(d.x+d.l*(.5+wind*.4)*f,d.y-1);}
  cx.stroke();
  const T=now/1000;
  snow.forEach((L,li)=>{const cnt=Math.round(L.list.length*amt);if(!cnt)return;
    cx.fillStyle=`rgba(${L.col},${L.a})`;cx.beginPath();
    for(let i=0;i<cnt;i++){const p=L.list[i];
      if(!reduce){p.y+=p.vy*dt*(1+P.tex.wind*.4);p.x+=(Math.sin(T*.8+p.ph)*10+wind*90)*L.wx*dt;if(p.y>H+5){p.y=-5;p.x=Math.random()*W;}if(p.x>W+5)p.x-=W+10;}
      if(li===0)cx.rect(p.x,p.y,p.r,p.r);else{cx.moveTo(p.x+p.r,p.y);cx.arc(p.x,p.y,p.r,0,6.2832);}}
    cx.fill();
    if(li===2){cx.strokeStyle=`rgba(${INK},.85)`;cx.lineWidth=.8;cx.stroke();}
  });
  // birds: small flocks drifting across the sky, startled by big cracks
  if(now>birdNext){birdNext=now+12000+Math.random()*22000;const n=2+((Math.random()*5)|0),dir=Math.random()<.5?1:-1,y0=H*(.1+Math.random()*.18);
    for(let i=0;i<n;i++)birds.push({x:dir>0?-20-i*(14+Math.random()*16):W+20+i*(14+Math.random()*16),y:y0+(Math.random()-.5)*30+i*3,vx:dir*(22+Math.random()*8),vy:0,s:3.2+Math.random()*1.8,ph:Math.random()*6.28,f:5+Math.random()*2});}
  if(birds.length){cx.strokeStyle=`rgba(${INK},.95)`;cx.lineWidth=1.1;cx.beginPath();
    birds=birds.filter(b=>{if(!reduce){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy*=.97;b.ph+=b.f*dt*(1+Math.abs(b.vy)/40);}
      const w=Math.sin(b.ph)*b.s*.7;cx.moveTo(b.x-b.s,b.y-w);cx.quadraticCurveTo(b.x-b.s*.4,b.y-w*.2-1,b.x,b.y);cx.quadraticCurveTo(b.x+b.s*.4,b.y-w*.2-1,b.x+b.s,b.y-w);
      return b.x>-80&&b.x<W+80&&b.y>-40;});cx.stroke();}
  cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=.9;cx.drawImage(grainCv,0,0);cx.globalAlpha=1;
  if(N.an){const a=meterBuf||(meterBuf=new Float32Array(N.an.fftSize));N.an.getFloatTimeDomainData(a);let m=0;for(let i=0;i<a.length;i++){const v=Math.abs(a[i]);if(v>m)m=v;}if(!isFinite(m))m=0;meterLv=Math.max(m,meterLv*.92);meterFill.style.width=Math.min(100,meterLv*130)+'%';}
  if(grainFlash>.02){grainFlash*=.92;drawWave();}
  requestAnimationFrame(frame);
}

/* ---------- wiring ---------- */
document.getElementById('recBtn').addEventListener('click',()=>rec?recStop():recStart());
document.getElementById('testA').addEventListener('click',beep);
document.getElementById('testB').addEventListener('click',beepB);
document.getElementById('compatBtn').addEventListener('click',()=>setCompat(!compat));
{let v=null;try{v=localStorage.getItem('kra-compat');}catch(e){}if(v==='1'){compat=true;const b=document.getElementById('compatBtn');b.textContent='Tryb zgodności: wł.';b.setAttribute('aria-pressed','true');}}
setInterval(()=>{if(ctx)diag();},1000);
document.getElementById('startBtn').addEventListener('click',()=>{document.getElementById('start').hidden=true;play();});
document.getElementById('playBtn').addEventListener('click',()=>{document.getElementById('start').hidden=true;playing?stop():play();});
const panel=document.getElementById('panel'),panelBtn=document.getElementById('panelBtn');
panelBtn.addEventListener('click',()=>{const c=panel.classList.toggle('collapsed');panelBtn.textContent=c?'Pokaż panel':'Ukryj panel';panelBtn.setAttribute('aria-expanded',!c);cracks=[];buildLayers();makeSnow();});
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(ctx&&ctx.state!=='running')ensureCtx();},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&playing)ctx.resume();});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(resize,150);});

(async function boot(){
  renderProg();generate();resize();requestAnimationFrame(frame);
  try{const dc=new OfflineAudioContext(2,1,44100);iceBuf=await dc.decodeAudioData(b64ToBuf(ICE_B64));analyse(iceBuf);drawWave();}
  catch(e){document.getElementById('waveName').textContent='Nie udało się wczytać sampla lodu. Wgraj własny plik.';}
})();
</script>
